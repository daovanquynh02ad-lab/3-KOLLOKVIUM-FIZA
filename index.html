<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>3 КОЛЛОКВИУМ ФИЗИОЛОГИЯ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* --- ЦВЕТОВАЯ ПАЛИТРА (СВЕТЛАЯ) --- */
            --bg-body: #F2F2F7;
            --bg-gradient: radial-gradient(circle at 10% 20%, rgb(239, 246, 255) 0%, rgb(255, 255, 255) 90%);
            
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.8);
            --glass-blur: blur(20px);
            
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            
            --accent: #007AFF;
            --accent-gradient: linear-gradient(135deg, #007AFF 0%, #0056b3 100%);
            --accent-glow: 0 8px 20px rgba(0, 122, 255, 0.3);
            
            --success: #34C759;
            --success-gradient: linear-gradient(135deg, #34C759 0%, #248a3d 100%);
            --success-bg: rgba(52, 199, 89, 0.15);
            
            --error: #FF3B30;
            --error-gradient: linear-gradient(135deg, #FF3B30 0%, #c92a21 100%);
            --error-bg: rgba(255, 59, 48, 0.1);
            
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.08), 0 5px 15px rgba(0,0,0,0.04);
            
            --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        [data-theme="dark"] {
            /* --- ЦВЕТОВАЯ ПАЛИТРА (ТЕМНАЯ) --- */
            --bg-body: #000000;
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
            
            --card-bg: rgba(28, 28, 30, 0.65);
            --card-border: rgba(255, 255, 255, 0.1);
            
            --text-primary: #FFFFFF;
            --text-secondary: #98989D;
            
            --accent: #0A84FF;
            --accent-gradient: linear-gradient(135deg, #0A84FF 0%, #0055ff 100%);
            --accent-glow: 0 8px 25px rgba(10, 132, 255, 0.4);

            --success-bg: rgba(48, 209, 88, 0.2);
            --error-bg: rgba(255, 69, 58, 0.2);
            
            --border: rgba(255, 255, 255, 0.12);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }
        
        button, .option, input, a { touch-action: manipulation; font-family: var(--font); }
        
        html { height: 100%; overscroll-behavior: none; }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            transition: color 0.3s ease, background-color 0.3s ease;
        }

        /* Красивый скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 10px; opacity: 0.2; }
        
        .main-scroll-area {
            flex: 1;
            overflow-y: auto; 
            overflow-x: hidden;
            padding: 20px; 
            padding-bottom: 120px; /* Место под плавающий футер */
            -webkit-overflow-scrolling: touch;
            width: 100%;
            max-width: 600px; /* Чуть уже для эстетики */
            margin: 0 auto;
        }

        /* --- ОБЩИЕ КОМПОНЕНТЫ --- */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-lg);
            border-radius: var(--radius-lg);
        }

        /* --- ЭКРАНЫ --- */
        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .screen.active { display: flex; }
        
        /* --- СТАРТОВЫЙ ЭКРАН --- */
        .start-header {
            margin: 30px 0 40px 0;
            text-align: center;
        }
        .start-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Fallback color if gradient fails */
            color: var(--accent); 
            margin-bottom: 12px;
            letter-spacing: -1px;
            line-height: 1.1;
        }
        .start-header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .topic-selector {
            padding: 20px;
            margin-bottom: 25px;
        }
        .topic-selector h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 15px;
            padding-left: 5px;
            opacity: 0.9;
        }
        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .topic-choice {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 600;
            font-size: 1rem;
            background: rgba(128, 128, 128, 0.05);
            border: 1px solid transparent;
        }
        .topic-choice:hover {
            background: rgba(128, 128, 128, 0.1);
            transform: translateY(-1px);
        }
        .topic-choice:active { transform: scale(0.98); }
        
        /* Кастомный чекбокс */
        .topic-choice input {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-secondary);
            border-radius: 6px;
            margin-right: 15px;
            position: relative;
            transition: all 0.2s;
            background: transparent;
        }
        .topic-choice input:checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .topic-choice input:checked::after {
            content: '\f00c';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: white;
            font-size: 12px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .select-all-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
            padding: 12px;
            font-size: 0.95rem;
            margin-top: 5px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .select-all-btn:hover { opacity: 1; }

        .start-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-btn {
            padding: 18px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            background: var(--card-bg); /* Fallback */
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        [data-theme="dark"] .menu-btn { background: rgba(44, 44, 46, 0.6); }

        .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .menu-btn:active { transform: scale(0.96); }
        
        .menu-btn.primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: var(--accent-glow);
            border: none;
        }
        .menu-btn.danger {
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid rgba(255, 59, 48, 0.2);
        }
        
        .menu-btn i {
            width: 24px;
            text-align: center;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .menu-btn.primary i { opacity: 1; color: white; }

        /* Верхняя панель */
        .top-settings {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .top-controls-group {
            display: flex;
            gap: 12px;
            margin-left: auto; 
        }
        .icon-btn {
            background: rgba(128, 128, 128, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid transparent;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: rgba(128, 128, 128, 0.2); transform: scale(1.05); }
        .icon-btn:active { transform: scale(0.9); }
        
        /* Прогресс бар */
        .progress-container {
            flex: 1;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .progress-text {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .progress-bar-bg {
            height: 8px;
            background: rgba(128, 128, 128, 0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent-gradient);
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 0 10px rgba(0, 122, 255, 0.5);
        }

        /* --- ЭКРАН ТЕСТА --- */
        .quiz-card {
            padding: 30px 25px;
            width: 100%;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .quiz-content-wrapper {
            /* Обертка для анимации контента внутри карточки */
            width: 100%;
        }
        
        .q-id {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }
        .q-title {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.35;
            margin-bottom: 35px;
            color: var(--text-primary);
        }
        
        .options-list { display: flex; flex-direction: column; gap: 14px; }
        
        .option {
            background: transparent; 
            border: 2px solid var(--border); 
            padding: 18px 20px; 
            border-radius: var(--radius-md); 
            cursor: pointer;
            font-size: 1.05rem; 
            font-weight: 500; 
            line-height: 1.4; 
            transition: all 0.2s; 
            display: flex; 
            align-items: flex-start; 
            gap: 16px; 
            user-select: none;
            position: relative;
        }
        
        .option:hover:not(.disabled) {
            background: rgba(128, 128, 128, 0.03);
            border-color: var(--text-secondary);
        }
        
        .option:active:not(.disabled) { transform: scale(0.98); }

        .option-marker {
            width: 26px; height: 26px; 
            border-radius: 50%; 
            border: 2px solid var(--border);
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            margin-top: 2px;
            background: var(--card-bg);
        }
        .option-marker i { font-size: 14px; color: white; opacity: 0; transition: 0.2s; }

        /* Состояния ответов */
        .option.selected:not(.disabled) { 
            border-color: var(--accent); 
            background: rgba(0, 122, 255, 0.08); 
        }
        .option.selected:not(.disabled) .option-marker { 
            background: var(--accent); 
            border-color: var(--accent); 
            transform: scale(1.1);
        }
        .option.selected:not(.disabled) .option-marker i { opacity: 1; content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight: 900; }

        .option.correct { 
            background: var(--success-bg); 
            border-color: var(--success); 
            color: var(--text-primary); 
        }
        .option.correct .option-marker { 
            background: var(--success); 
            border-color: var(--success); 
            transform: scale(1.1);
        }
        .option.correct .option-marker i { opacity: 1; content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight: 900; }
        
        .option.incorrect { 
            background: var(--error-bg); 
            border-color: var(--error); 
            color: var(--text-primary); 
        }
        .option.incorrect .option-marker { 
            background: var(--error); 
            border-color: var(--error); 
            transform: scale(1.1);
        }
        .option.incorrect .option-marker i { opacity: 1; content: '\f00d'; font-family: "Font Awesome 6 Free"; font-weight: 900; }

        .option.missed { 
            border: 2px dashed var(--success); 
            opacity: 0.7; 
        }
        .option.disabled { cursor: default; }

        /* --- ПЛАВАЮЩИЙ ФУТЕР --- */
        .quiz-footer {
            position: fixed; 
            bottom: 25px; 
            left: 20px; 
            right: 20px; 
            z-index: 100;
            display: flex;
            justify-content: center;
            pointer-events: none; /* Чтобы клики проходили сквозь пустые места */
        }

        .footer-inner {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-lg);
            pointer-events: auto;
            transition: transform 0.3s;
        }

        .controls { display: flex; gap: 12px; width: 100%; }
        
        .nav-btn {
            width: 50px;
            height: 50px; 
            border-radius: 18px; 
            border: none; 
            cursor: pointer; 
            font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center; 
            background: rgba(128, 128, 128, 0.08); 
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: rgba(128, 128, 128, 0.15); transform: translateY(-2px); }
        .nav-btn:active:not(:disabled) { transform: scale(0.9); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .action-btn {
            flex: 1;
            height: 50px; 
            border-radius: 18px; 
            border: none; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 1.1rem; 
            color: white;
            background: var(--accent-gradient); 
            box-shadow: var(--accent-glow);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.5px;
        }
        .action-btn:disabled { 
            background: var(--text-secondary); 
            box-shadow: none; 
            opacity: 0.3; 
            transform: none; 
            cursor: default;
        }
        .action-btn.correct { background: var(--success-gradient); box-shadow: 0 5px 20px rgba(52, 199, 89, 0.4); }
        .action-btn.incorrect { background: var(--error-gradient); box-shadow: 0 5px 20px rgba(255, 59, 48, 0.4); }
        
        .action-btn:active:not(:disabled) { transform: scale(0.95); }

        /* --- РЕЗУЛЬТАТЫ --- */
        .stat-box { 
            background: rgba(128, 128, 128, 0.05); 
            border: 1px solid var(--border); 
            padding: 20px; 
            border-radius: var(--radius-md); 
            text-align: center; 
        }
        .stat-val { font-size: 2.2rem; font-weight: 800; margin-bottom: 5px; }
        .stat-label { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); }
        .stat-val.correct { color: var(--success); }
        .stat-val.error { color: var(--error); }
        
        /* АНИМАЦИИ */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .anim-slide-in { animation: slideInRight 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .anim-shake { animation: shake 0.3s ease-in-out; }

    </style>
</head>
<body>

    <div class="main-scroll-area">

        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <div class="top-settings">
                <div style="width: 44px"></div> <!-- Spacer to balance layout -->
                <div class="top-controls-group">
                    <a href="https://t.me/stewonly" target="_blank" class="icon-btn" aria-label="Telegram">
                        <i class="fab fa-telegram-plane"></i>
                    </a>
                    <button class="icon-btn theme-toggle" onclick="toggleTheme()" id="theme-toggle-btn-start">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
            <div class="start-header">
                <h1>ФИЗИОЛОГИЯ<br><span style="font-size: 0.6em; opacity: 0.7; font-weight: 600;">КОЛЛОКВИУМ 3</span></h1>
                <p>Тренажер по вопросам 902-1456</p>
            </div>
            
            <div class="glass-panel topic-selector">
                <h3>ВЫБЕРИТЕ ТЕМЫ</h3>
                <div class="topic-list" id="topic-list"></div>
                <button class="select-all-btn" onclick="toggleSelectAll(this)">Выбрать все</button>
            </div>
            
            <div class="start-controls">
                <div id="resume-block" style="display:none; width: 100%;">
                    <button class="menu-btn primary" onclick="startQuiz('resume')">
                        <i class="fas fa-play"></i>
                        <div>
                            <div>Продолжить</div>
                            <div style="font-size: 0.8em; opacity: 0.8; font-weight: 400;">Сохраненная попытка</div>
                        </div>
                    </button>
                </div>
                <button class="menu-btn danger" id="mistakes-btn-start" style="display:none;" onclick="startQuiz('mistakes')">
                    <i class="fas fa-bug"></i> &nbsp; Работа над ошибками (<span id="mistakes-count">0</span>)
                </button>
                <button class="menu-btn" onclick="startQuiz('new')">
                    <i class="fas fa-redo"></i> &nbsp; Начать заново (по порядку)
                </button>
                <button class="menu-btn" onclick="startQuiz('shuffle')">
                    <i class="fas fa-random"></i> &nbsp; Случайный порядок
                </button>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="screen">
            <div class="top-settings" style="margin-bottom: 10px;">
                <div class="progress-container">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <span class="progress-text" id="mode-label">ТЕСТ</span>
                        <span class="progress-text" id="progress-text"></span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-bar"></div>
                    </div>
                </div>
                
                <div class="top-controls-group">
                    <button class="icon-btn theme-toggle" onclick="toggleTheme()" id="theme-toggle-btn-quiz">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>

            <div class="glass-panel quiz-card" id="question-card">
                <div class="quiz-content-wrapper" id="quiz-content">
                    <div class="q-id" id="q-id-display">Раздел</div>
                    <div class="q-title" id="q-text">Загрузка...</div>
                    <div class="options-list" id="options-list"></div>
                </div>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen">
             <div class="start-header" style="margin-top: 60px;">
                <h1 id="result-title">Тест завершен!</h1>
                <div style="font-size: 4rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--accent); margin: 10px 0;">
                    <span id="final-score">0%</span>
                </div>
            </div>
            
            <div class="glass-panel" style="padding: 20px; margin-bottom: 30px;">
                <div class="result-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="stat-box">
                        <div class="stat-val correct" id="correct-val">0</div>
                        <div class="stat-label">Верно</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val error" id="error-val">0</div>
                        <div class="stat-label">Ошибки</div>
                    </div>
                </div>
            </div>

            <div class="start-controls">
                 <button class="menu-btn danger" id="mistakes-btn-end" onclick="startQuiz('mistakes')" style="display:none">
                    <i class="fas fa-bug"></i> &nbsp; Работа над ошибками
                </button>
                <button class="menu-btn" onclick="goHome()">
                    <i class="fas fa-home"></i> &nbsp; В главное меню
                </button>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="quiz-footer" id="quiz-footer" style="display: none;">
        <div class="footer-inner">
             <div class="controls">
                <button class="nav-btn" id="home-btn" onclick="goHome()"><i class="fas fa-home"></i></button>

                `;

        function checkStorageForResume() {
            try {
                var savedMain = JSON.parse(localStorage.getItem(KEY_MAIN));
                if (savedMain && savedMain.questions && savedMain.questions.length > 0) {
                     resumeBtn.style.display = 'block';
                } else {
                    resumeBtn.style.display = 'none';
                }
                
                var errorIds = JSON.parse(localStorage.getItem(KEY_ERRORS)) || [];

            }

        function toggleSelectAll(button) {
            var checkboxes = document.querySelectorAll('.topic-checkbox');
            var allSelected = Array.from(checkboxes).every(function(cb) { return cb.checked; });

            button.textContent = allSelected ? "Выбрать все" : "Снять выделение";
        }

        // --- ЛОГИКА ТЕМЫ ---
        function toggleTheme() {
            var currentTheme = document.body.getAttribute('data-theme');
            var newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            if (newTheme === 'light') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', newTheme);
            }
            localStorage.setItem('physio_theme', newTheme);
            document.querySelectorAll('.theme-toggle i').forEach(function(btn) {
                var icon = btn.classList;
                if (icon.contains('fa-moon') || icon.contains('fa-sun')) {
                    icon.remove(newTheme === 'dark' ? 'fa-moon' : 'fa-sun');
                    icon.add(newTheme === 'dark' ? 'fa-sun' : 'fa-moon');
                }
            });
        }

        function loadTheme() {
            var theme = localStorage.getItem('physio_theme') || 'light';
            if (theme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            } else {
                document.body.removeAttribute('data-theme');
            }
        }
        
        function goHome() {
            if (currentMode === 'main') {
                saveMainProgress(); 
            }
            switchScreen('start');
            checkStorageForResume(); 
        }

        // --- ЛОГИКА ЗАПУСКА ТЕСТА ---
        function startQuiz(mode) {
            currentMode = mode;
            userAnswers = {};
            activeQuestions = [];
            currentIndex = 0;
            
            if (mode === 'resume') {
                try {
                    var savedData = JSON.parse(localStorage.getItem(KEY_MAIN));
                    if (savedData) {
                        currentMode = 'main';
                        activeQuestions = savedData.questions;
                        currentIndex = savedData.index;
                        userAnswers = savedData.answers || {};
                    } else {
                        alert("Нет сохраненной игры");
                        return;
                    }
                } catch(e) {
                    localStorage.removeItem(KEY_MAIN);
                    alert("Ошибка сохранения. Начните заново.");
                    return;
                }
            } 
            else if (mode === 'mistakes') {
                var errorIds = JSON.parse(localStorage.getItem(KEY_ERRORS)) || [];
                if (errorIds.length === 0) {
                    alert("Ошибок пока нет!");
                    return;
                }
                errorIds.forEach(function(id) {
                    if (allQuestionsMap[id]) activeQuestions.push(allQuestionsMap[id]);
                });
            } 
            else {
                currentMode = 'main';
                var selectedKeys = Array.from(document.querySelectorAll('.topic-checkbox:checked')).map(function(cb) { return cb.dataset.topicKey; });
                if (selectedKeys.length === 0) { alert("Выберите хотя бы одну тему!"); return; }

                selectedKeys.forEach(function(key) {
                    topicData[key].questions.forEach(function(q) {
                        // Клонирование объекта
                        var qCopy = JSON.parse(JSON.stringify(q));
                        qCopy.topic = topicData[key].name;
                        activeQuestions.push(qCopy);
                    });
                });
                
                if (activeQuestions.length === 0) { alert("Нет вопросов."); return; }

                if (mode === 'shuffle') {
                    shuffleArray(activeQuestions);
                    activeQuestions.forEach(function(q) {
                        var correctOriginalTexts = q.correct.map(function(idx) { return q.opts[idx]; });
                        shuffleArray(q.opts);
                        q.correct = correctOriginalTexts.map(function(text) { return q.opts.findIndex(function(opt) { return opt === text; }); });
                    });
                }
                localStorage.removeItem(KEY_MAIN);
            }

            switchScreen('quiz');
            renderQuestion(true);
        }

                userAnswers[q.id] = { selected: [], isSubmitted: false, isCorrect: false };
            }
            var state = userAnswers[q.id];

            var progressPercent = ((currentIndex + 1) / activeQuestions.length) * 100;
            progressBarFill.style.width = progressPercent + "%";
            
            // ИЗМЕНЕНИЕ: Показываем реальный номер вопроса из сборника
            progressText.textContent = "№ " + q.id;
            
            modeLabel.textContent = (currentMode === 'mistakes') ? 'ОШИБКИ' : 'ТЕСТ';
            
            qIdEl.textContent = q.topic; 
            qTextEl.textContent = q.q;

            // Анимация входа
            quizContentWrapper.classList.remove('anim-slide-in');
            if (!isFirstLoad) {
                // Трюк для перезапуска анимации
                void quizContentWrapper.offsetWidth; 
                quizContentWrapper.classList.add('anim-slide-in');
            }

            optionsList.innerHTML = '';
            var selectedSet = new Set(state.selected);

            q.opts.forEach(function(optText, idx) {
                var div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = '<div class="option-marker"></div><div class="option-text">' + optText + '</div>';
                var marker = div.querySelector('.option-marker');

                if (state.isSubmitted) {
                    div.classList.add('disabled');
                    var isCorrectOption = q.correct.includes(idx);
                    var isSelected = selectedSet.has(idx);

                    if (isCorrectOption) { 
                        div.classList.add('correct'); 
                        marker.innerHTML = '<i class="fas fa-check"></i>'; 
                    }
                    else if (isSelected) { 
                        div.classList.add('incorrect'); 
                        marker.innerHTML = '<i class="fas fa-times"></i>'; 
                    }
                    
                    if (isCorrectOption && !isSelected) { div.classList.add('missed'); }
                } else {
                    if (selectedSet.has(idx)) { 
                        div.classList.add('selected'); 
                        marker.innerHTML = '<i class="fas fa-check"></i>'; 
                    }
                    div.onclick = function() { toggleOption(q.id, idx); };
                }
                optionsList.appendChild(div);
            });
            
            updateFooter(state);
            if (currentMode === 'main') saveMainProgress();
        }

        function toggleOption(qId, idx) {
            var state = userAnswers[qId];
            if (state.isSubmitted) return;
            
            var selectedSet = new Set(state.selected);
            if (selectedSet.has(idx)) selectedSet.delete(idx);
            else selectedSet.add(idx);
            
            state.selected = Array.from(selectedSet);
            
            var options = document.querySelectorAll('.option');
            var opt = options[idx];
            if (opt) {
                if (selectedSet.has(idx)) {
                    opt.classList.add('selected');
                    opt.querySelector('.option-marker').innerHTML = '<i class="fas fa-check"></i>';
                } else {
                    opt.classList.remove('selected');
                    opt.querySelector('.option-marker').innerHTML = '';
                }
            }
            updateFooter(state);
        }

        // --- ЛОГИКА ФУТЕРА ---
        function updateFooter(state) {
            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === activeQuestions.length - 1);
            
            // Сброс стилей кнопки действия
            mainBtn.className = 'action-btn';
            
            if (state.isSubmitted) {
                if (currentIndex === activeQuestions.length - 1) {
                    mainBtn.textContent = "Завершить";
                } else {
                    mainBtn.textContent = "Далее";
                }
                mainBtn.disabled = false;
                
                if(state.isCorrect) mainBtn.classList.add('correct');
                else mainBtn.classList.add('incorrect');
                
            } else {
                mainBtn.textContent = "Ответить";
                mainBtn.disabled = (state.selected.length === 0);
            }
        }
        
        function handleMainClick() {
            var q = activeQuestions[currentIndex];
            var state = userAnswers[q.id];
            
            if (!state.isSubmitted) {
                submitAnswer(q, state);
            } else {
                if (currentIndex < activeQuestions.length - 1) {
                    nextQ();
                } else {
                    finishQuiz();
                }
            }
        }

        function submitAnswer(q, state) {
            state.isSubmitted = true;
            
            var userArr = state.selected.slice().sort();
            var correctArr = q.correct.slice().sort();
            state.isCorrect = (JSON.stringify(userArr) === JSON.stringify(correctArr));
            
            // Анимация тряски при ошибке
            if (!state.isCorrect) {
                 var card = document.getElementById('question-card');
                 card.classList.remove('anim-shake');
                 void card.offsetWidth; 
                 card.classList.add('anim-shake');
            }
            
            var globalErrors = JSON.parse(localStorage.getItem(KEY_ERRORS)) || [];
            if (!state.isCorrect) {
                if (!globalErrors.includes(q.id)) {
                    globalErrors.push(q.id);
                }
            } else {
                if (currentMode === 'mistakes') {
                      globalErrors = globalErrors.filter(function(id) { return id !== q.id; });
                }
            }
            localStorage.setItem(KEY_ERRORS, JSON.stringify(globalErrors));

            if (currentMode === 'main') saveMainProgress();
            renderQuestion(false);
        }

        function nextQ() {
            if (currentIndex < activeQuestions.length - 1) {
                currentIndex++;
                renderQuestion(false);
            }
        }
        function prevQ() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(false);
            }
        }

        function saveMainProgress() {
            var progress = {
                index: currentIndex,
                questions: activeQuestions,
                answers: userAnswers
            };
            localStorage.setItem(KEY_MAIN, JSON.stringify(progress));
        }

        function finishQuiz() {
            var correctCount = 0;
            activeQuestions.forEach(function(q) {
                if(userAnswers[q.id] && userAnswers[q.id].isCorrect) { correctCount++; }
            });

            var total = activeQuestions.length;
            var percent = Math.round((correctCount / total) * 100);

            document.getElementById('final-score').textContent = percent + "%";
            document.getElementById('correct-val').textContent = correctCount;
            document.getElementById('error-val').textContent = total - correctCount;

            var title = document.getElementById('result-title');
            if (percent === 100) title.textContent = "Идеально!";
            else if (percent >= 80) title.textContent = "Отлично!";
            else if (percent >= 50) title.textContent = "Неплохо!";
            else title.textContent = "Стоит повторить";

            if (currentMode === 'main') {
                localStorage.removeItem(KEY_MAIN);
            }
            
            var globalErrors = JSON.parse(localStorage.getItem(KEY_ERRORS)) || [];
            if (globalErrors.length > 0) {
                mistakesBtnEnd.style.display = 'flex';
            } else {
                mistakesBtnEnd.style.display = 'none';
            }

            switchScreen('result');
        }

        function switchScreen(screenName) {
            Object.values(screens).forEach(function(s) { s.classList.remove('active'); });
            screens[screenName].classList.add('active');
            
            // Показываем футер только в тесте, и с небольшой задержкой для анимации
            if (screenName === 'quiz') {
                quizFooter.style.display = 'flex';
                quizFooter.style.opacity = '0';
                setTimeout(function(){ quizFooter.style.opacity = '1'; }, 100);
            } else {
                quizFooter.style.display = 'none';
            }
        }

        function shuffleArray(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }
        
        document.addEventListener('keydown', function(e) {
            if (screens.quiz.classList.contains('active')) {
                if (e.key === 'ArrowRight') nextBtn.click();
                if (e.key === 'ArrowLeft') prevBtn.click();
                if (e.key === 'Enter') mainBtn.click();
            }
        });
        
    </script>
</body>
</html>
