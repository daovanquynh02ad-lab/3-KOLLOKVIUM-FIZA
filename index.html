<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>3 КОЛЛОКВИУМ ФИЗИОЛОГИЯ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #F9F9F9;
            --card-bg: #FFFFFF;
            --text-primary: #111111;
            --text-secondary: #555555;
            --accent: #007AFF;
            --accent-light: #F0F8FF;
            --success: #34C759;
            --success-light: #F0FFF4;
            --error: #FF3B30;
            --error-light: #FFF0F0;
            --border: #E5E5E5;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.07), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #000000;
            --card-bg: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #8D8D93;
            --accent: #0A84FF;
            --accent-light: #2C2C2E;
            --success: #30D158;
            --success-light: #2C2C2E;
            --error: #FF453A;
            --error-light: #2C2C2E;
            --border: #3A3A3C;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        button, .option, input, a {
            touch-action: manipulation;
        }
        
        html { height: 100%; overscroll-behavior: none; }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .main-scroll-area {
            flex: 1;
            overflow-y: auto; 
            overflow-x: hidden;
            padding: 20px 20px 140px 20px; 
            -webkit-overflow-scrolling: touch;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        /* --- ЭКРАНЫ --- */
        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.3s ease-out;
        }
        .screen.active {
            display: flex;
        }
        
        /* --- СТАРТОВЫЙ ЭКРАН --- */
        .start-header {
            margin: 20px 0 30px 0;
            text-align: center;
        }
        .start-header h1 {
            font-size: 2.0rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 10px;
            line-height: 1.2;
            text-transform: uppercase;
        }
        .start-header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .topic-selector {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 15px;
            margin-bottom: 20px;
        }
        .topic-selector h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 15px;
            padding-left: 10px;
        }
        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .topic-choice {
            display: flex;
            align-items: center;
            padding: 12px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .topic-choice:hover {
            background-color: var(--bg);
        }
        .topic-choice input {
            transform: scale(1.2);
            margin-right: 12px;
            accent-color: var(--accent);
        }
        .topic-choice span {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-left: auto;
        }
        .select-all-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            padding: 10px;
            font-size: 0.9rem;
        }

        .start-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-btn {
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--card-bg);
            color: var(--text-primary);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.1s;
            user-select: none;
        }
        .menu-btn:active {
            transform: scale(0.98);
        }
        .menu-btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            font-weight: 700;
        }
        .menu-btn.danger {
            background: var(--error-light);
            color: var(--error);
            border-color: var(--error);
            font-weight: 700;
        }
        .menu-btn i {
            width: 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        .menu-btn.primary i { color: white; }
        .menu-btn.danger i { color: var(--error); }

        .top-settings {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-controls-group {
            display: flex;
            gap: 10px;
            margin-left: auto; 
        }
        .icon-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s;
        }
        .icon-btn i { font-size: 1.2rem; }
        
        .progress-pill {
            background: var(--card-bg);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        /* --- ЭКРАН ТЕСТА --- */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 25px;
            width: 100%;
            border: 1px solid var(--border);
            margin-top: 20px;
            position: relative;
        }
        .q-id {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .q-title {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 30px;
            color: var(--text-primary);
        }
        
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: var(--bg); border: 2px solid var(--bg); padding: 16px; border-radius: 12px; cursor: pointer;
            font-size: 1rem; font-weight: 500; line-height: 1.4; transition: border-color 0.1s, background-color 0.1s; 
            display: flex; align-items: center; gap: 15px; 
            user-select: none;
        }
        
        .option-marker {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border);
            flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: 0.2s; position: relative;
        }
        .option-marker i { font-size: 12px; color: white; opacity: 0; transition: 0.2s; }

        .option.selected:not(.disabled) { border-color: var(--accent); background: var(--accent-light); }
        .option.selected:not(.disabled) .option-marker { background: var(--accent); border-color: var(--accent); }
        .option.selected:not(.disabled) .option-marker i { opacity: 1; content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight: 900; }

        .option.correct { background: var(--success-light); border-color: var(--success); color: var(--text-primary); }
        .option.correct .option-marker { background: var(--success); border-color: var(--success); }
        .option.correct .option-marker i { opacity: 1; content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight: 900; }
        
        .option.incorrect { background: var(--error-light); border-color: var(--error); color: var(--text-primary); }
        .option.incorrect .option-marker { background: var(--error); border-color: var(--error); }
        .option.incorrect .option-marker i { opacity: 1; content: '\f00d'; font-family: "Font Awesome 6 Free"; font-weight: 900; }

        .option.missed { border: 2px dashed var(--success); background: var(--success-light); opacity: 0.8; }
        .option.disabled { cursor: default; }

        /* --- ФУТЕР --- */
        .quiz-footer {
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            padding: 20px;
            background: var(--card-bg); 
            border-top: 1px solid var(--border);
            z-index: 100;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }
        [data-theme="dark"] .quiz-footer { background: var(--card-bg); }

        .footer-inner {
            max-width: 640px;
            margin: 0 auto;
        }

        .controls { display: grid; grid-template-columns: 50px 1fr 50px 50px; gap: 10px; }
        
        .nav-btn, .action-btn {
            user-select: none;
            -webkit-user-select: none;
        }

        .nav-btn {
            height: 50px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center; background: var(--card-bg); color: var(--text-primary);
            box-shadow: var(--shadow); 
        }
        .nav-btn:active:not(:disabled) { transform: scale(0.95); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
        
        .action-btn {
            height: 50px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-size: 1rem; color: white;
            background: var(--accent); box-shadow: var(--shadow); 
            transition: background-color 0.1s;
        }
        .action-btn:disabled { background: var(--text-secondary); box-shadow: none; opacity: 0.5; }
        .action-btn.correct { background: var(--success); }
        .action-btn.incorrect { background: var(--error); }
        .action-btn:active:not(:disabled) { transform: scale(0.98); }

        /* --- РЕЗУЛЬТАТЫ --- */
        .stat-box { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 12px; text-align: center; box-shadow: var(--shadow); }
        .stat-val { font-size: 1.8rem; font-weight: 700; }
        .stat-label { font-size: 0.9rem; color: var(--text-secondary); }
        .stat-val.correct { color: var(--success); }
        .stat-val.error { color: var(--error); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="main-scroll-area">

        <div id="start-screen" class="screen active">
            <div class="top-settings">
                <span></span>
                <div class="top-controls-group">
                    <a href="https://t.me/stewonly" target="_blank" class="icon-btn" aria-label="Telegram">
                        <i class="fab fa-telegram-plane"></i>
                    </a>
                    <button class="icon-btn theme-toggle" onclick="toggleTheme()" id="theme-toggle-btn-start">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
            <div class="start-header">
                <h1>3 КОЛЛОКВИУМ ФИЗИОЛОГИЯ</h1>
                <p>Тренажер по вопросам 902-1456.</p>
            </div>
            
            <div class="topic-selector">
                <h3>Выберите темы:</h3>
                <div class="topic-list" id="topic-list"></div>
                <button class="select-all-btn" onclick="toggleSelectAll(this)">Выбрать все</button>
            </div>
            
            <div class="start-controls">
                <div id="resume-block" style="display:none; width: 100%;">
                    <button class="menu-btn primary" onclick="startQuiz('resume')">
                        <i class="fas fa-play"></i> &nbsp; Продолжить (Основной)
                    </button>
                </div>
                <button class="menu-btn danger" id="mistakes-btn-start" style="display:none;" onclick="startQuiz('mistakes')">
                    <i class="fas fa-bug"></i> &nbsp; Работа над ошибками (<span id="mistakes-count">0</span>)
                </button>
                <button class="menu-btn" onclick="startQuiz('new')">
                    <i class="fas fa-redo"></i> &nbsp; Начать заново (по порядку)
                </button>
                <button class="menu-btn" onclick="startQuiz('shuffle')">
                    <i class="fas fa-random"></i> &nbsp; Случайный порядок
                </button>
            </div>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="top-settings" style="margin-bottom: 20px;">
                <div class="progress-pill" id="progress-pill">1 / 50</div>
                <div class="top-controls-group">
                    <a href="https://t.me/stewonly" target="_blank" class="icon-btn" aria-label="Telegram">
                        <i class="fab fa-telegram-plane"></i>
                    </a>
                    <button class="icon-btn theme-toggle" onclick="toggleTheme()" id="theme-toggle-btn-quiz">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>

            <div class="quiz-card" id="question-card">
                <div class="q-id" id="q-id-display">Раздел: ...</div>
                <div class="q-title" id="q-text">Загрузка...</div>
                <div class="options-list" id="options-list"></div>
            </div>
        </div>

        <div id="result-screen" class="screen">
             <div class="start-header" style="margin:0;">
                <h1 id="result-title">Тест завершен!</h1>
                <p id="result-subtitle" style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin-top: 10px;">Результат: <span id="final-score">0%</span></p>
            </div>
            <div class="result-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin: 30px 0;">
                <div class="stat-box">
                    <div class="stat-val correct" id="correct-val">0</div>
                    <div class="stat-label">Верно</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val error" id="error-val">0</div>
                    <div class="stat-label">Ошибки</div>
                </div>
            </div>
            <div class="start-controls" style="margin-top: 20px;">
                 <button class="menu-btn danger" id="mistakes-btn-end" onclick="startQuiz('mistakes')" style="display:none">
                    <i class="fas fa-bug"></i> &nbsp; Работа над ошибками
                </button>
                <button class="menu-btn" onclick="goHome()">
                    <i class="fas fa-home"></i> &nbsp; В главное меню
                </button>
            </div>
        </div>

    </div>

    <div class="quiz-footer" id="quiz-footer" style="display: none;">
        <div class="footer-inner">
             <div class="controls">
                <button class="nav-btn" id="prev-btn" onclick="prevQ()"><i class="fas fa-chevron-left"></i></button>
                <button class="action-btn" id="main-btn" onclick="handleMainClick()">Ответить</button>
                <button class="nav-btn" id="next-btn" onclick="nextQ()"><i class="fas fa-chevron-right"></i></button>
                <button class="nav-btn" id="home-btn" onclick="goHome()"><i class="fas fa-home"></i></button>
            </div>
        </div>
    </div>
    
    <script>
        // --- БАЗА ДАННЫХ ВОПРОСОВ (используем VAR вместо CONST) ---
        var D={t1:{n:"1. Анатомия ЖКТ",q:[
        {i:902,q:"Укажите особенности, характерные для полого органа:",o:["имеет строму и паренхиму","имеет паренхиму и дольчатое строение","имеет внутреннюю полость и 3-х слойную стенку","имеет строму и внутреннюю полость"],c:[2]},
        {i:903,q:"Укажите особенности, характерные для паренхиматозного органа:",o:["имеет внутреннюю полость и 3-х слойную стенку","имеет паренхиму и дольчатое строение","имеет строму и паренхиму","имеет строму и внутреннюю полость"],c:[1,2]},
        {i:904,q:"К пищеварительной системе относятся:",o:["глотка","ротовая полость","желудок","носовая полость","гортань"],c:[0,1,2]},
        {i:905,q:"К пищеварительной системе относятся:",o:["тонкая кишка","селезенка","пищевод","гортань"],c:[0,2]},
        {i:906,q:"Полость рта ограничена:",o:["щеками, зубами, зевом, небом","щеками, губами, зевом, диафрагмой рта, небом","щеками, губами, деснами с зубами","деснами с зубами, небом, диафрагмой рта"],c:[1]},
        {i:907,q:"Полость рта делится на отделы:",o:["собственно полость рта и преддверие рта","губы, полость рта и собственно полость рта","щечная область, полость рта и преддверие рта"],c:[0]},
        {i:908,q:"Секреторная функция в полости рта осуществляется",o:["только подъязычной слюнной железой","только поднижнечелюстной слюнной железой","малыми и большими слюнными железами","только околоушной слюнной железой"],c:[2]},
        {i:909,q:"Зев состоит из:",o:["задней стенки глотки","небные дужки и мягкое небо","пустого пространства","небных дужек, мягкого неба, корня языка"],c:[3]},
        {i:910,q:"Глотка состоит из:",o:["3-х частей","2-х частей","4-х частей"],c:[0]},
        {i:911,q:"Глотка состоит из:",o:["ротоглотки, носоглотки, гортани","ротоглотки, гортаноглотки, носоглотки","ротоглотки, гортаноглотки, зева","носоглотки, задней стенки, зева"],c:[1]},
        {i:912,q:"Пищевод –",o:["имеет четыре сужения","паренхиматозный орган","имеет три сужения","полый орган"],c:[2,3]},
        {i:913,q:"Мышечная оболочка пищевода состоит из:",o:["3-х слоев","4-х слоев","2-х слоев","1-го слоя"],c:[2]},
        {i:914,q:"Желудок состоит из:",o:["кардиальной части, дна, тела, привратниковой части","дна, тела, ампулы","дна, тела, шейки"],c:[0]},
        {i:915,q:"Стенка желудка состоит из следующих оболочек:",o:["мышечной","серозной","адвентициальной","слизистой"],c:[0,1,3]},
        {i:916,q:"Назовите слои мышечной оболочки желудка:",o:["круговой","косой","перистый","продольный"],c:[0,1,3]},
        {i:917,q:"Депонирующая функция желудка осуществляется его:",o:["привратниковой частью","дном","телом"],c:[1]},
        {i:918,q:"Какими клетками желудочных желез секретируются пепсины?",o:["париетальными","эндокринными","главными","добавочными"],c:[2]},
        {i:919,q:"Какими клетками желудочных желез секретируется соляная кислота?",o:["мукоцитами","обкладочными","добавочными","главными"],c:[1]},
        {i:920,q:"Какими клетками желудочных желез секретируется слизь?",o:["добавочными","главными","эндокринными","обкладочными"],c:[0]},
        {i:921,q:"Поджелудочная железа –",o:["полый орган","выделяет панкреатический сок","паренхиматозный орган","выделяет желчь"],c:[1,2]},
        {i:922,q:"В поджелудочной железе выделяют:",o:["головку","хвост","ножку","перешеек","тело"],c:[0,1,4]},
        {i:923,q:"Печень -",o:["паренхиматозный орган","полый орган","выделяет панкреатический сок","выделяет желчь"],c:[0,3]},
        {i:924,q:"В печени выделяют:",o:["призматическую и квадратную доли","переднюю и заднюю доли","левую и правую доли","верхнюю и нижнюю доли"],c:[2]},
        {i:925,q:"Структурно-функциональной единицей печени является:",o:["долька","нефрон","ацинус"],c:[0]},
        {i:926,q:"В желчном пузыре выделяют:",o:["хвост","дно","шейку","тело","ножку"],c:[1,2,3]},
        {i:927,q:"В состав желчи входят:",o:["холестерин","желчные кислоты","желчные пигменты","ферменты","холецистокинин"],c:[0,1,2]},
        {i:928,q:"Общий желчный проток формируется из:",o:["протока ПЖ и общего печеночного протока","протока желчного пузыря и протока ПЖ","протока ПЖ и протока желчного пузыря","общего печеночного протока и протока желчного пузыря"],c:[3]},

        {i:1448,q:"В сырую погоду:",o:["АД","проводимость","потоотделение","теплопроведение и конвекция","адаптация"],c:[3]},
        {i:1449,q:"При 40С отдача:",o:["излучение","испарение","теплопроведение","конвекция","все"],c:[1]},
        {i:1450,q:"Тироксин:",o:["активирует дыхание","уменьшает разобщение","увеличивает разобщение","тормозит"],c:[2]},
        {i:1451,q:"В сауне отдача:",o:["испарение","теплопроведение","конвекция","излучение"],c:[0]},
        {i:1452,q:"Подкожный жир:",o:["препятствует отдаче","способствует","уменьшает продукцию","нет"],c:[0]},
        {i:1453,q:"Макс пот (сутки):",o:["20","5","10","30"],c:[2]},
        {i:1454,q:"Тепло через кожу %:",o:["40","80","100","20","60"],c:[1]},
        {i:1455,q:"Макс теплопродукция в покое:",o:["мышцы","грудная","печень","кожа"],c:[2]},
        {i:1456,q:"Бурый жир:",o:["гликоген","несократительный термогенез","сократительный","АТФ"],c:[1]}
        ]}};

        // --- ОБРАБОТКА ДАННЫХ (используем VAR) ---
        var topicData = {};
        var allQuestionsMap = {}; 
        for (var key in D) {
            topicData[key] = {
                name: D[key].n,
                questions: D[key].q.map(function(item) {
                    var qObj = {
                        id: item.i.toString(),
                        q: item.q,
                        opts: item.o,
                        correct: item.c
                    };
                    allQuestionsMap[qObj.id] = Object.assign({}, qObj, { topic: D[key].n });
                    return qObj;
                })
            };
        }

        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ (используем VAR) ---
        var activeQuestions = [];
        var currentIndex = 0;
        var userAnswers = {}; 
        var currentMode = 'default';
        
        // КЛЮЧИ LOCALSTORAGE (используем VAR)
        var KEY_MAIN = 'physio_v3_progress';
        var KEY_ERRORS = 'physio_v3_errors';

        // --- DOM ЭЛЕМЕНТЫ (используем VAR) ---
        var screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            result: document.getElementById('result-screen')
        };
        var resumeBtn = document.getElementById('resume-block');
        var mistakesBtnStart = document.getElementById('mistakes-btn-start');
        var mistakesBtnEnd = document.getElementById('mistakes-btn-end');
        var mistakesCountEl = document.getElementById('mistakes-count');
        
        var quizFooter = document.getElementById('quiz-footer');
        var cardContainer = document.getElementById('question-card');
        var qIdEl = document.getElementById('q-id-display');
        var qTextEl = document.getElementById('q-text');
        var optionsList = document.getElementById('options-list');
        var mainBtn = document.getElementById('main-btn');
        var prevBtn = document.getElementById('prev-btn');
        var nextBtn = document.getElementById('next-btn');
        var themeToggleBtns = document.querySelectorAll('button.theme-toggle'); 
        var progressPill = document.getElementById('progress-pill');
        var topicListEl = document.getElementById('topic-list');

        // --- ИНИЦИАЛИЗАЦИЯ ---
        document.addEventListener('DOMContentLoaded', function() {
            // Очистка при загрузке страницы, чтобы сбрасывать прогресс
            localStorage.removeItem(KEY_MAIN);
            localStorage.removeItem(KEY_ERRORS);
            
            loadTheme();
            populateTopics();
            checkStorageForResume();
            themeToggleBtns.forEach(function(btn) { btn.onclick = toggleTheme; });
        });
        
        function populateTopics() {
            for (var key in topicData) {
                var topic = topicData[key];
                var label = document.createElement('label');
                label.className = 'topic-choice';
                label.innerHTML = `
                    <input type="checkbox" class="topic-checkbox" data-topic-key="${key}" checked>
                    ${topic.name}
                    <span>(${topic.questions.length} вопр.)</span>
                `;
                topicListEl.appendChild(label);
            }
        }
        
        function checkStorageForResume() {
            var savedMain = JSON.parse(localStorage.getItem(KEY_MAIN));
            if (savedMain && savedMain.questions && savedMain.questions.length > 0) {
                 resumeBtn.style.display = 'block';
            } else {
                resumeBtn.style.display = 'none';
            }
            
            var errorIds = JSON.parse(localStorage.getItem(KEY_ERRORS)) || [];
            if (errorIds.length > 0) {
                mistakesBtnStart.style.display = 'flex';
                mistakesCountEl.textContent = errorIds.length;
            } else {
                mistakesBtnStart.style.display = 'none';
            }
        }

        function toggleSelectAll(button) {
            var checkboxes = document.querySelectorAll('.topic-checkbox');
            var allSelected = Array.from(checkboxes).every(function(cb) { return cb.checked; });
            checkboxes.forEach(function(cb) { cb.checked = !allSelected; });
            button.textContent = allSelected ? "Выбрать все" : "Снять выделение";
        }

        // --- ЛОГИКА ТЕМЫ ---
        function toggleTheme() {
            var currentTheme = document.body.getAttribute('data-theme');
            var newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            if (newTheme === 'light') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', newTheme);
            }
            localStorage.setItem('physio_theme', newTheme);
            document.querySelectorAll('.theme-toggle i').forEach(function(btn) {
                var icon = btn.classList;
                if (icon.contains('fa-moon') || icon.contains('fa-sun')) {
                    icon.remove(newTheme === 'dark' ? 'fa-moon' : 'fa-sun');
                    icon.add(newTheme === 'dark' ? 'fa-sun' : 'fa-moon');
                }
            });
        }

        function loadTheme() {
            var theme = localStorage.getItem('physio_theme') || 'light';
            if (theme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            } else {
                document.body.removeAttribute('data-theme');
            }
        }
        
        function goHome() {
            if (currentMode === 'main') {
                saveMainProgress(); 
            }
            switchScreen('start');
            checkStorageForResume(); 
        }

        // --- ЛОГИКА ЗАПУСКА ТЕСТА ---
        function startQuiz(mode) {
            currentMode = mode;
            userAnswers = {};
            activeQuestions = [];
            currentIndex = 0;
            
            if (mode === 'resume') {
                var savedData = JSON.parse(localStorage.getItem(KEY_MAIN));
                if (savedData) {
                    currentMode = 'main';
                    activeQuestions = savedData.questions;
                    currentIndex = savedData.index;
                    userAnswers = savedData.answers || {};
                } else {
                    alert("Нет сохраненной игры");
                    return;
                }
            } 
            else if (mode === 'mistakes') {
                var errorIds = JSON.parse(localStorage.getItem(KEY_ERRORS)) || [];
                if (errorIds.length === 0) {
                    alert("Ошибок пока нет!");
                    return;
                }
                errorIds.forEach(function(id) {
                    if (allQuestionsMap[id]) activeQuestions.push(allQuestionsMap[id]);
                });
            } 
            else {
                currentMode = 'main';
                var selectedKeys = Array.from(document.querySelectorAll('.topic-checkbox:checked')).map(function(cb) { return cb.dataset.topicKey; });
                if (selectedKeys.length === 0) { alert("Выберите хотя бы одну тему!"); return; }

                selectedKeys.forEach(function(key) {
                    topicData[key].questions.forEach(function(q) {
                        // Клонирование объекта
                        var qCopy = JSON.parse(JSON.stringify(q));
                        qCopy.topic = topicData[key].name;
                        activeQuestions.push(qCopy);
                    });
                });
                
                if (activeQuestions.length === 0) { alert("Нет вопросов."); return; }

                if (mode === 'shuffle') {
                    shuffleArray(activeQuestions);
                    activeQuestions.forEach(function(q) {
                        var correctOriginalTexts = q.correct.map(function(idx) { return q.opts[idx]; });
                        shuffleArray(q.opts);
                        q.correct = correctOriginalTexts.map(function(text) { return q.opts.findIndex(function(opt) { return opt === text; }); });
                    });
                }
                localStorage.removeItem(KEY_MAIN);
            }

            switchScreen('quiz');
            renderQuestion(true);
        }
        
        // --- РЕНДЕР ВОПРОСА ---
        function renderQuestion(isFirstLoad) {
            if (typeof isFirstLoad === 'undefined') isFirstLoad = false;
            var q = activeQuestions[currentIndex];
            if (!q) return;

            if (!userAnswers[q.id]) {
                userAnswers[q.id] = { selected: [], isSubmitted: false, isCorrect: false };
            }
            var state = userAnswers[q.id];

            var modeText = (currentMode === 'mistakes') ? 'Работа над ошибками' : 'Тест';
            progressPill.textContent = modeText + ": " + (currentIndex + 1) + " / " + activeQuestions.length;
            qIdEl.textContent = q.topic; 
            qTextEl.textContent = q.q;

            cardContainer.style.animation = 'none';
            if (!isFirstLoad) {
                void cardContainer.offsetWidth; 
                cardContainer.style.animation = "fadeIn 0.2s ease-out";
            }

            optionsList.innerHTML = '';
            var selectedSet = new Set(state.selected);

            q.opts.forEach(function(optText, idx) {
                var div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = '<div class="option-marker"></div><div class="option-text">' + optText + '</div>';
                var marker = div.querySelector('.option-marker');

                if (state.isSubmitted) {
                    div.classList.add('disabled');
                    var isCorrectOption = q.correct.includes(idx);
                    var isSelected = selectedSet.has(idx);

                    if (isCorrectOption) { 
                        div.classList.add('correct'); 
                        marker.innerHTML = '<i class="fas fa-check"></i>'; 
                    }
                    else if (isSelected) { 
                        div.classList.add('incorrect'); 
                        marker.innerHTML = '<i class="fas fa-times"></i>'; 
                    }
                    
                    if (isCorrectOption && !isSelected) { div.classList.add('missed'); }
                } else {
                    if (selectedSet.has(idx)) { 
                        div.classList.add('selected'); 
                        marker.innerHTML = '<i class="fas fa-check"></i>'; 
                    }
                    div.onclick = function() { toggleOption(q.id, idx); };
                }
                optionsList.appendChild(div);
            });
            
            updateFooter(state);
            if (currentMode === 'main') saveMainProgress();
        }

        function toggleOption(qId, idx) {
            var state = userAnswers[qId];
            if (state.isSubmitted) return;
            
            var selectedSet = new Set(state.selected);
            if (selectedSet.has(idx)) selectedSet.delete(idx);
            else selectedSet.add(idx);
            
            state.selected = Array.from(selectedSet);
            
            var options = document.querySelectorAll('.option');
            var opt = options[idx];
            if (opt) {
                if (selectedSet.has(idx)) {
                    opt.classList.add('selected');
                    opt.querySelector('.option-marker').innerHTML = '<i class="fas fa-check"></i>';
                } else {
                    opt.classList.remove('selected');
                    opt.querySelector('.option-marker').innerHTML = '';
                }
            }
            updateFooter(state);
        }

        // --- ЛОГИКА ФУТЕРА ---
        function updateFooter(state) {
            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === activeQuestions.length - 1);
            
            mainBtn.className = 'action-btn';
            
            if (state.isSubmitted) {
                if (currentIndex === activeQuestions.length - 1) {
                    mainBtn.textContent = "Завершить";
                } else {
                    mainBtn.textContent = "Далее";
                }
                mainBtn.disabled = false;
                
                if(state.isCorrect) mainBtn.classList.add('correct');
                else mainBtn.classList.add('incorrect');
                
            } else {
                mainBtn.textContent = "Ответить";
                mainBtn.disabled = (state.selected.length === 0);
            }
        }
        
        function handleMainClick() {
            var q = activeQuestions[currentIndex];
            var state = userAnswers[q.id];
            
            if (!state.isSubmitted) {
                submitAnswer(q, state);
            } else {
                if (currentIndex < activeQuestions.length - 1) {
                    nextQ();
                } else {
                    finishQuiz();
                }
            }
        }

        function submitAnswer(q, state) {
            state.isSubmitted = true;
            
            var userArr = state.selected.slice().sort();
            var correctArr = q.correct.slice().sort();
            state.isCorrect = (JSON.stringify(userArr) === JSON.stringify(correctArr));
            
            var globalErrors = JSON.parse(localStorage.getItem(KEY_ERRORS)) || [];
            if (!state.isCorrect) {
                if (!globalErrors.includes(q.id)) {
                    globalErrors.push(q.id);
                }
            } else {
                if (currentMode === 'mistakes') {
                     globalErrors = globalErrors.filter(function(id) { return id !== q.id; });
                }
            }
            localStorage.setItem(KEY_ERRORS, JSON.stringify(globalErrors));

            if (currentMode === 'main') saveMainProgress();
            renderQuestion(false);
        }

        function nextQ() {
            if (currentIndex < activeQuestions.length - 1) {
                currentIndex++;
                renderQuestion(false);
            }
        }
        function prevQ() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(false);
            }
        }

        function saveMainProgress() {
            var progress = {
                index: currentIndex,
                questions: activeQuestions,
                answers: userAnswers
            };
            localStorage.setItem(KEY_MAIN, JSON.stringify(progress));
        }

        function finishQuiz() {
            var correctCount = 0;
            activeQuestions.forEach(function(q) {
                if(userAnswers[q.id] && userAnswers[q.id].isCorrect) { correctCount++; }
            });

            var total = activeQuestions.length;
            var percent = Math.round((correctCount / total) * 100);

            document.getElementById('final-score').textContent = percent + "%";
            document.getElementById('correct-val').textContent = correctCount;
            document.getElementById('error-val').textContent = total - correctCount;

            var title = document.getElementById('result-title');
            if (percent === 100) title.textContent = "Идеально!";
            else if (percent >= 80) title.textContent = "Отлично!";
            else if (percent >= 50) title.textContent = "Неплохо!";
            else title.textContent = "Стоит повторить";

            if (currentMode === 'main') {
                localStorage.removeItem(KEY_MAIN);
            }
            
            var globalErrors = JSON.parse(localStorage.getItem(KEY_ERRORS)) || [];
            if (globalErrors.length > 0) {
                mistakesBtnEnd.style.display = 'flex';
            } else {
                mistakesBtnEnd.style.display = 'none';
            }

            switchScreen('result');
        }

        function switchScreen(screenName) {
            Object.values(screens).forEach(function(s) { s.classList.remove('active'); });
            screens[screenName].classList.add('active');
            quizFooter.style.display = (screenName === 'quiz') ? 'block' : 'none';
        }

        function shuffleArray(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }
        
        document.addEventListener('keydown', function(e) {
            if (screens.quiz.classList.contains('active')) {
                if (e.key === 'ArrowRight') nextBtn.click();
                if (e.key === 'ArrowLeft') prevBtn.click();
                if (e.key === 'Enter') mainBtn.click();
            }
        });
        
    </script>
</body>
</html>
