<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Физиология: ЖКТ и Обмен веществ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #000000; --text-sec: #8E8E93;
            --accent: #007AFF; /* Синий (физиология) */
            --success: #34C759; --success-bg: #E3FBE9;
            --error: #FF3B30; --error-bg: #FFE5E5;
            --border: #E5E5EA; --radius: 20px; --shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        [data-theme="dark"] {
            --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; --text-sec: #98989F;
            --accent: #0A84FF; --success: #32D74B; --success-bg: #0e3314;
            --error: #FF453A; --error-bg: #381010; --border: #38383A;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .container { flex: 1; overflow-y: auto; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; }
        .screen { display: none; animation: fade 0.25s ease-out; }
        .screen.active { display: block; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title h1 { font-size: 1.8rem; font-weight: 800; }
        .theme-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid var(--border); }
        .topic-item { display: flex; align-items: center; padding: 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .topic-item.selected .check { background: var(--accent); border-color: var(--accent); color: white; }
        .check { width: 24px; height: 24px; border: 2px solid var(--border); border-radius: 50%; margin-right: 15px; display: flex; align-items: center; justify-content: center; }
        
        .btn { border: none; padding: 18px; border-radius: 16px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; display: flex; justify-content: center; gap: 10px; }
        .btn-primary { background: var(--accent); color: white; }
        
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin: 10px 0 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; }
        
        .opt { background: var(--bg); padding: 16px; border-radius: 14px; margin-bottom: 10px; cursor: pointer; font-weight: 500; border: 2px solid transparent; display: flex; gap: 15px; }
        .opt-char { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8rem; color: var(--text-sec); }
        .opt.correct { background: var(--success-bg); border-color: var(--success); }
        .opt.correct .opt-char { background: var(--success); border-color: var(--success); color: white; }
        .opt.wrong { background: var(--error-bg); border-color: var(--error); }
        .opt.wrong .opt-char { background: var(--error); border-color: var(--error); color: white; }
        
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px 20px 30px; background: var(--card); border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; max-width: 700px; margin: 0 auto; z-index: 100; }
        
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-start" class="screen active">
        <div class="header">
            <div class="title"><h1>Физиология</h1><p>ЖКТ, Обмен веществ, Терморегуляция</p></div>
            <div class="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
        </div>
        <div class="card" id="topic-list"></div>
        <button class="btn btn-primary" onclick="startQuiz()">Начать тест</button>
    </div>

    <div id="screen-quiz" class="screen" style="padding-bottom: 100px;">
        <div class="header">
            <span style="font-weight:600" id="progress-text">0/0</span>
            <span style="color:var(--accent); font-weight:700" id="score-text">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="card">
            <div style="color:var(--accent); font-size:0.85rem; font-weight:700; margin-bottom:10px;" id="q-topic"></div>
            <div style="font-size:1.2rem; font-weight:700; line-height:1.4;" id="q-text"></div>
        </div>
        <div id="options-box"></div>
    </div>

    <div id="screen-result" class="screen" style="text-align: center; padding-top: 40px;">
        <h1>Результат</h1>
        <div style="font-size: 4rem; font-weight: 800; color: var(--accent); margin: 20px 0;" id="final-score">0%</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:30px;">
            <div class="card"><div style="font-size:2rem; font-weight:700; color:var(--success)" id="res-c">0</div><div>Верно</div></div>
            <div class="card"><div style="font-size:2rem; font-weight:700; color:var(--error)" id="res-e">0</div><div>Ошибки</div></div>
        </div>
        <button class="btn btn-primary" onclick="location.reload()">В меню</button>
    </div>
</div>

<div class="nav-bar" id="nav-bar" style="display: none;">
    <button class="btn" style="background:var(--bg); color:var(--text); border:1px solid var(--border); padding:0;" onclick="prevQ()"><i class="fas fa-chevron-left"></i></button>
    <button class="btn btn-primary" style="margin:0" id="action-btn" onclick="handleAnswer()">Ответить</button>
    <button class="btn" style="background:var(--bg); color:var(--text); border:1px solid var(--border); padding:0;" onclick="nextQ()"><i class="fas fa-chevron-right"></i></button>
</div>

<script>

            {id:915,q:"Стенка желудка состоит из следующих оболочек:",opts:["мышечной","серозной","адвентициальной","слизистой"],c:[0,1,3]},

    let state = {
        mode: 'default',
        queue: [],
        currentIdx: 0,
        answers: {}, // { id: { sel: 0, correct: true/false } }
        startTime: 0
    };

    const DB_KEY = 'physio_full_app_v2'; // Новый ключ для физиологии

    // Init
    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        renderTopics();
        loadState();
    });

    function renderTopics() {
        const list = document.getElementById('topic-list');
        list.innerHTML = '';
        Object.keys(topicData).forEach(key => {
            const t = topicData[key];
            const el = document.createElement('div');
            el.className = 'topic-item selected';
            el.dataset.key = key;
            el.onclick = () => {
                el.classList.toggle('selected');
                updateStartBtn();
            };
            el.innerHTML = `
                <div class="check-circle"><i class="fas fa-check" style="font-size: 12px;"></i></div>
                <div class="topic-name">${t.name}</div>
                <div class="topic-count">${t.questions.length}</div>
            `;
            list.appendChild(el);
        });
    }

    function toggleAllTopics() {
        const items = document.querySelectorAll('.topic-item');
        const allSel = Array.from(items).every(i => i.classList.contains('selected'));
        items.forEach(i => allSel ? i.classList.remove('selected') : i.classList.add('selected'));
    }

    function startQuiz(mode) {
        state.mode = mode;
        state.answers = {};
        
        if (mode === 'resume') {
            const saved = JSON.parse(localStorage.getItem(DB_KEY));
            state = saved;
        } else if (mode === 'mistakes') {
            const saved = JSON.parse(localStorage.getItem(DB_KEY));
            const mistakes = [];
            // Находим ошибки из сохраненной истории
            if(saved && saved.answers) {
                 for (let id in saved.answers) {
                     if (!saved.answers[id].correct) mistakes.push(id);
                 }
            }
            if(!mistakes.length) return alert("Ошибок нет!");
            
            state.queue = [];
            Object.values(topicData).forEach(sec => {
                sec.questions.forEach(q => {
                    if(mistakes.includes(q.id.toString())) state.queue.push(q);
                });
            });
            state.currentIdx = 0;
        } else {
            // New or Shuffle
            const keys = Array.from(document.querySelectorAll('.topic-item.selected')).map(el => el.dataset.key);
            if(!keys.length) return alert('Выберите тему!');
            
            state.queue = [];
            keys.forEach(k => {
                state.queue.push(...topicData[k].questions.map(q => ({...q, topicName: topicData[k].name})));
            });
            
            if (mode === 'shuffle') state.queue.sort(() => Math.random() - 0.5);
            state.currentIdx = 0;
            localStorage.removeItem(DB_KEY); // Clear old
        }
        
        showScreen('quiz');
        renderQuestion();
    }

    function renderQuestion() {
        const q = state.queue[state.currentIdx];
        const ans = state.answers[q.id];
        
        document.getElementById('q-topic').innerText = q.topicName || (q.id + " раздел");
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('progress-text').innerText = `${state.currentIdx + 1} / ${state.queue.length}`;
        document.getElementById('progress-fill').style.width = `${((state.currentIdx + 1) / state.queue.length) * 100}%`;
        
        const box = document.getElementById('options-box');
        box.innerHTML = '';
        
        q.opts.forEach((txt, idx) => {
            const el = document.createElement('div');
            el.className = 'opt';
            // Logic for highlighting
            if (ans) {
                if (q.c.includes(idx)) el.classList.add('correct');
                else if (ans.sel === idx) el.classList.add('wrong');
                // Disable clicks
                el.style.opacity = ans.sel === idx || q.c.includes(idx) ? '1' : '0.5';
            } else {
                el.onclick = () => selectOpt(idx);
            }
            
            el.innerHTML = `<div class="opt-char">${idx+1}</div><div>${txt}</div>`;
            if(ans && ans.sel === idx) el.classList.add('selected'); 
            box.appendChild(el);
        });
        
        // Button state
        const btn = document.getElementById('action-btn');
        if (ans) {
            btn.innerText = state.currentIdx === state.queue.length - 1 ? "Завершить" : "Далее";
            btn.onclick = state.currentIdx === state.queue.length - 1 ? finish : nextQ;
            btn.className = "btn btn-primary";
        } else {
            btn.innerText = "Выберите ответ";
            btn.className = "btn btn-sec";
            btn.onclick = null;
        }
        
        saveState();
    }

    function selectOpt(idx) {
        const q = state.queue[state.currentIdx];
        const isCorrect = q.c.includes(idx);
        state.answers[q.id] = { sel: idx, correct: isCorrect };
        renderQuestion();
    }

    function nextQ() {
        if (state.currentIdx < state.queue.length - 1) {
            state.currentIdx++;
            renderQuestion();
        }
    }

    function prevQ() {
        if (state.currentIdx > 0) {
            state.currentIdx--;
            renderQuestion();
        }
    }

    function finish() {
        let correct = 0;
        state.queue.forEach(q => {
            if (state.answers[q.id] && state.answers[q.id].correct) correct++;
        });
        
        document.getElementById('final-score').innerText = Math.round((correct / state.queue.length) * 100) + '%';
        document.getElementById('res-c').innerText = correct;
        document.getElementById('res-e').innerText = state.queue.length - correct;
        
        showScreen('result');
        if(state.mode !== 'mistakes') saveState(); 
    }

    function goHome() {
        showScreen('start');
        loadState(); 
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + id).classList.add('active');
        document.getElementById('nav-bar').style.display = id === 'quiz' ? 'grid' : 'none';
    }

    function saveState() {
        localStorage.setItem(DB_KEY, JSON.stringify(state));
    }

    function loadState() {
        const saved = JSON.parse(localStorage.getItem(DB_KEY));
        if (saved && saved.queue && saved.queue.length > 0) {
            document.getElementById('resume-btn').style.display = 'block';
            // Check mistakes
            let hasMistakes = false;
            if (saved.answers) {
                 hasMistakes = Object.values(saved.answers).some(a => !a.correct);
            }
            if(hasMistakes) document.getElementById('mistakes-btn').style.display = 'flex';
        }
    }

    function initTheme() {
        if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
    }
    function toggleTheme() {
        const isDark = document.body.hasAttribute('data-theme');
        if (isDark) {
            document.body.removeAttribute('data-theme');
            localStorage.removeItem('theme');
        } else {
            document.body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    }
    function updateStartBtn() {}
</script>
</body>
</html>
